[package]
name = "embassy-time-arduino"
version = "0.0.1"
edition = "2024"
authors = ["Torsten Schmitz"]
license = "MIT"
repository = "https://github.com/TorstenSchmitz/embassy-time-arduino"
description = "embassy-time driver for arduinos"

[dependencies]
static_assertions = "1.1.0"
embassy-time-driver = "0.2.2"
avr-device = { version = "0.8.1", features = ["rt", "critical-section", "device-selected"] }
vcell = { version = "0.1.3", optional = true }
critical-section = "1.2.0"
embassy-time-queue-utils = "0.3.2"

[dependencies.avr-hal-generic]
git = "https://github.com/rahix/avr-hal"
rev = "e0b0105b11a7c4209fb1704276a7921c3139d5cb"

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e0b0105b11a7c4209fb1704276a7921c3139d5cb"
features = ["rt"]
optional = true

[features]
default = []
stack_addr = ["dep:vcell"]
hal-selected = []

prescalar1 = ["embassy-time-driver/tick-hz-80_000_000"]
prescalar8 = ["embassy-time-driver/tick-hz-10_240_000"]
prescalar64 = ["embassy-time-driver/tick-hz-1_280_000"]
prescalar256 = ["embassy-time-driver/tick-hz-320_000"]
prescalar1024 = ["embassy-time-driver/tick-hz-80_000"]

arduino-diecimila = ["arduino-hal/arduino-diecimila", "avr-device/atmega168", "hal-selected"]
arduino-leonardo = ["arduino-hal/arduino-leonardo", "avr-device/atmega32u4", "hal-selected"]
arduino-mega2560 = ["arduino-hal/arduino-mega2560", "avr-device/atmega2560", "hal-selected"]
arduino-mega1280 = ["arduino-hal/arduino-mega1280", "avr-device/atmega1280","hal-selected"]
arduino-nano = ["arduino-hal/arduino-nano", "avr-device/atmega328p", "hal-selected"]
arduino-micro = ["arduino-hal/arduino-micro", "avr-device/atmega32u4", "hal-selected"]
arduino-uno = ["arduino-hal/arduino-uno", "avr-device/atmega328p", "hal-selected"]
trinket-pro = ["arduino-hal/trinket-pro", "avr-device/atmega328p",  "hal-selected"]
sparkfun-promicro = ["arduino-hal/sparkfun-promicro", "avr-device/atmega32u4", "hal-selected"]
sparkfun-promini-3v3 = ["arduino-hal/sparkfun-promini-3v3", "avr-device/atmega328p", "hal-selected"]
sparkfun-promini-5v = ["arduino-hal/sparkfun-promini-5v", "avr-device/atmega328p", "hal-selected"]
nano168 = ["arduino-hal/nano168", "avr-device/atmega168", "hal-selected"]

docrs = ["arduino-uno"]


# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
